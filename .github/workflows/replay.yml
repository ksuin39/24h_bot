name: AI Replay Train (압축 학습)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "과거 며칠치 데이터로 학습할지"
        default: "10"
      epochs:
        description: "몇 번 반복 재생할지"
        default: "5"
  push:
    branches: [main]
    paths:
      - 'replay_train.py'
      - '.github/workflows/replay.yml'

permissions:
  contents: write

jobs:
  replay:
    name: 압축 학습 (${{ inputs.days || '10' }}일치 x ${{ inputs.epochs || '5' }}회)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python replay_train.py --days ${{ inputs.days || '10' }} --epochs ${{ inputs.epochs || '5' }}
      - name: 결과를 저장소에 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/replay_result.md
          git commit -m "replay result" || exit 0
          git pull --rebase
          git push
