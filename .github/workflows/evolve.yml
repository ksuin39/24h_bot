name: Evolve AI (매일 진화)

on:
  schedule:
    - cron: '17 * * * *'    # 매시간 17분에 실행 (한 번에 약 45분 진화)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evolve.py'
      - '.github/workflows/evolve.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: evolve
  cancel-in-progress: false

jobs:
  evolve:
    name: 단계별 진화 (약 45분)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUN_MINUTES: '45'
      CHAIN_UNTIL: '2026-11-23T00:00:00+09:00'   # 이 시각까지는 끝나자마자 다음 실행을 바로 이어서 시작
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba
      - run: python evolve.py
      - name: 진화 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add evolution/ data/
          git commit -m "evolution: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: 다음 실행 바로 이어가기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s); until=$(date -u -d "$CHAIN_UNTIL" +%s)
          if [ "$now" -lt "$until" ]; then
            gh workflow run evolve.yml --ref main && echo "다음 실행 예약됨"
          else
            echo "연속 실행 기간 종료 - 이후는 매시간 예약 실행만"
          fi
