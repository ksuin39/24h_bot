name: Evolve AI (매일 진화)

on:
  schedule:
    - cron: '17 * * * *'    # 매시간 17분에 실행 (한 번에 약 45분 진화)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evolve.py'
      - '.github/workflows/evolve.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: evolve
  cancel-in-progress: false

jobs:
  evolve:
    name: 단계별 진화 (약 45분)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUN_MINUTES: '45'
      MAX_RUNS: '100'    # 실행 100번째까지 쉬지 않고 이어서 진화하고 멈춤
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba
      - run: python evolve.py
      - name: 진화 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add evolution/ data/
          git commit -m "evolution: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: 다음 실행 바로 이어가기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull -q || true
          run=$(python -c "import json;print(json.load(open('evolution/state.json')).get('run',0))" 2>/dev/null || echo 0)
          echo "지금까지 실행: $run / $MAX_RUNS"
          if [ "$run" -lt "$MAX_RUNS" ]; then
            gh workflow run evolve.yml --ref main && echo "다음 실행 예약됨"
          else
            echo "목표한 실행 횟수 도달 - 연속 실행 종료"
          fi
