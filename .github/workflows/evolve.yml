name: Evolve AI (매일 진화)

on:
  schedule:
    - cron: '43 22 * * *'   # 매일 한국시간 오전 7:43
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evolve.py'
      - '.github/workflows/evolve.yml'

permissions:
  contents: write

concurrency:
  group: evolve
  cancel-in-progress: false

jobs:
  evolve:
    name: 하루치 진화
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba
      - run: python evolve.py
      - name: 진화 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add evolution/ data/
          git commit -m "evolution: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || exit 0
          git pull --rebase
          git push
